<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floor Plan — Dilene Realty Group</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500&display=swap">
  <style>
    :root { --paper: #F5EFE3; --ink: #241F1B; --soft: #4A423B; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #E9E2D4; color: var(--ink); font-family: "Public Sans", system-ui, sans-serif; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 18px 24px; }
    header a { color: var(--soft); text-decoration: none; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    header a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
    header h1 { margin: 0; font: 600 18px "Fraunces", Georgia, serif; }
    main { padding: 0 24px 40px; }
    .sheet { max-width: 1100px; margin: 0 auto; background: var(--paper); box-shadow: 0 30px 60px -30px rgba(40,30,20,.5); overflow-x: auto; }
    .sheet svg { display: block; width: 100%; height: auto; }
    .tools { max-width: 1100px; margin: 12px auto 0; display: flex; gap: 14px; font-size: 12px; color: var(--soft); }
    .tools button { font: inherit; letter-spacing: .1em; text-transform: uppercase; background: none; border: 1px solid #CBBFAD; padding: 8px 12px; cursor: pointer; color: var(--ink); }
    .tools button:hover { border-color: var(--ink); }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Floor Plan</h1>
    <a href="/">← Back to the walkthrough</a>
  </header>
  <main>
    <div class="sheet" id="sheet"></div>
    <div class="tools">
      <button id="dl-svg" type="button">Download SVG</button>
      <span id="meta"></span>
    </div>
  </main>
  <script type="module" src="/src/plan-page.ts"></script>
</body>
</html>
